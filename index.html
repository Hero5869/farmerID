<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmer ID Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* Verdant Pattern with 30% Opacity */
    .wallpaper-pattern {
      background-color: #fbfdf3;
      background-image: 
        radial-gradient(circle at 50% 0px, rgba(190, 242, 100, 0.3) 38%, rgba(0, 0, 0, 0) 40%),
        radial-gradient(circle at 0px 100%, rgba(217, 249, 157, 0.3) 38%, rgba(0, 0, 0, 0) 40%),
        radial-gradient(circle at 100% 100%, rgba(217, 249, 157, 0.3) 38%, rgba(0, 0, 0, 0) 40%);
      background-size: 24px 24px;
      background-position: 0% 0%, 0% 0%, 0% 0%;
    }
    .custom-spin {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="wallpaper-pattern text-slate-800 font-sans min-h-screen">

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxVz9rViRfVXulh30yZoPJsRoCs2I7v_RE3EMe8vjQr4fyNoPTv2uGJqWqTSr5txQ/exec";
  </script>

  <!-- Navbar -->
  <header class="bg-emerald-800 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-id-card text-2xl text-amber-300"></i>
        <span class="font-bold text-lg tracking-wide">Farmer ID Portal</span>
      </div>
      <div id="userHeaderActions"></div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <!-- Alert Box -->
    <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium flex items-center justify-between shadow-sm">
      <span id="alertMsg"></span>
      <button onclick="dismissAlert()" class="ml-4 text-xl font-bold leading-none">&times;</button>
    </div>

    <!-- Auth Gateway Card -->
    <div id="authSection" class="max-w-md mx-auto bg-white/95 backdrop-blur-sm rounded-2xl shadow-lg border border-slate-200/80 p-6">
      <div class="flex border-b border-slate-200 mb-6">
        <button id="tabLogin" onclick="switchAuthTab('login')" class="w-1/2 pb-3 font-semibold text-emerald-700 border-b-2 border-emerald-700 text-center transition">Login</button>
        <button id="tabSignup" onclick="switchAuthTab('signup')" class="w-1/2 pb-3 font-semibold text-slate-500 hover:text-slate-800 text-center transition">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mobile Number</label>
          <input type="tel" id="loginMobile" maxlength="10" placeholder="10-digit Mobile" required class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
          <input type="password" id="loginPassword" placeholder="Minimum 4 digits" required class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <button type="submit" id="btnLogin" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-3 rounded-xl font-medium transition flex items-center justify-center space-x-2 shadow">
          <span id="btnLoginText">Sign In</span>
          <div id="btnLoginSpinner" class="custom-spin w-4 h-4 hidden"></div>
        </button>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" onsubmit="handleSignupSubmit(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Full Name</label>
          <input type="text" id="signName" placeholder="Your Full Name" required class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mobile Number</label>
          <input type="tel" id="signMobile" maxlength="10" placeholder="10-digit Mobile" required class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Create Password</label>
          <input type="password" id="signPassword" placeholder="Minimum 4 digits" minlength="4" required class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <button type="submit" id="btnSignup" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-3 rounded-xl font-medium transition flex items-center justify-center space-x-2 shadow">
          <span id="btnSignupText">Register Account</span>
          <div id="btnSignupSpinner" class="custom-spin w-4 h-4 hidden"></div>
        </button>
      </form>
    </div>

    <!-- Authenticated Dashboard -->
    <div id="dashboardSection" class="hidden space-y-6">
      <!-- Submission Card -->
      <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-sm border border-slate-200/80 p-6">
        <h2 class="text-lg font-bold text-slate-800 mb-1">Get Farmer ID Card</h2>
        <p class="text-sm text-slate-500 mb-4">Enter your 12-digit number below to initiate your application.</p>
        
        <div class="flex flex-col sm:flex-row gap-3">
          <div class="flex-1">
            <input 
              type="text" 
              id="applyAadhaar" 
              maxlength="16" 
              placeholder="Enter 12-digit ID" 
              class="w-full px-4 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 font-mono tracking-wider text-base transition" 
              onkeydown="if(event.key === 'Enter') submitFarmerRequest()"
            />
          </div>
          <!-- Animated Action Button -->
          <button 
            type="button" 
            id="btnSubmitReq" 
            onclick="submitFarmerRequest()" 
            class="bg-emerald-700 hover:bg-emerald-800 text-white px-7 py-2.5 rounded-xl font-semibold transition flex items-center justify-center space-x-2 shadow whitespace-nowrap cursor-pointer">
            <div id="submitBtnContent" class="flex items-center space-x-2">
              <i class="fa-solid fa-paper-plane text-sm"></i>
              <span>Submit Request</span>
            </div>
            <div id="submitBtnLoading" class="hidden flex items-center space-x-2">
              <div class="custom-spin w-5 h-5"></div>
              <span>Submitting Request...</span>
            </div>
          </button>
        </div>
      </div>

      <!-- Live Applications Queue -->
      <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/70">
          <div>
            <h3 class="font-bold text-slate-800">Your Recent Applications</h3>
            <span class="text-xs text-slate-500">Showing top 5 entries</span>
          </div>
          <div class="flex items-center space-x-2 text-xs text-emerald-700 font-medium">
            <span class="w-2 h-2 rounded-full bg-emerald-600 animate-pulse"></span>
            <span id="syncCountdown">Auto-sync in 5s</span>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-600">
            <thead class="bg-slate-100/80 text-slate-700 font-semibold text-xs uppercase tracking-wider">
              <tr>
                <th class="px-6 py-3">Request ID</th>
                <th class="px-6 py-3">ID Number (Masked)</th>
                <th class="px-6 py-3">Date</th>
                <th class="px-6 py-3">Status</th>
                <th class="px-6 py-3 text-right">Card Action</th>
              </tr>
            </thead>
            <tbody id="userRequestsTable" class="divide-y divide-slate-100">
              <tr><td colspan="5" class="text-center py-6 text-slate-400">Loading your entries...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script>
    let sessionToken = localStorage.getItem("farmer_token");
    let currentUserName = localStorage.getItem("farmer_name");
    let countdownInterval = null;
    let remainingSeconds = 5;
    let isFetching = false;
    let lastRenderedHash = "";

    window.onload = () => {
      if (sessionToken) {
        showDashboard();
      } else {
        showAuth();
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          stopAutoSync();
        } else if (sessionToken) {
          fetchUserRequests();
          startAutoSync();
        }
      });
    };

    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById("alertBox");
      const text = document.getElementById("alertMsg");
      box.className = `mb-6 p-4 rounded-xl text-sm font-medium flex items-center justify-between shadow-sm ${
        isSuccess ? "bg-emerald-100 text-emerald-900 border border-emerald-300" : "bg-red-100 text-red-900 border border-red-300"
      }`;
      text.innerText = msg;
      box.classList.remove("hidden");
    }

    function dismissAlert() {
      document.getElementById("alertBox").classList.add("hidden");
    }

    function switchAuthTab(type) {
      dismissAlert();
      if (type === 'login') {
        document.getElementById("loginForm").classList.remove("hidden");
        document.getElementById("signupForm").classList.add("hidden");
        document.getElementById("tabLogin").className = "w-1/2 pb-3 font-semibold text-emerald-700 border-b-2 border-emerald-700 text-center transition";
        document.getElementById("tabSignup").className = "w-1/2 pb-3 font-semibold text-slate-500 hover:text-slate-800 text-center transition";
      } else {
        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("signupForm").classList.remove("hidden");
        document.getElementById("tabSignup").className = "w-1/2 pb-3 font-semibold text-emerald-700 border-b-2 border-emerald-700 text-center transition";
        document.getElementById("tabLogin").className = "w-1/2 pb-3 font-semibold text-slate-500 hover:text-slate-800 text-center transition";
      }
    }

    async function handleLoginSubmit(e) {
      if (e) e.preventDefault();
      dismissAlert();
      const mobile = document.getElementById("loginMobile").value.trim();
      const password = document.getElementById("loginPassword").value.trim();
      
      setLoading("btnLogin", true, "Signing in...");
      const res = await callBackendApi("login", { mobile, password });
      setLoading("btnLogin", false, "Sign In");

      if (res && res.success) {
        localStorage.setItem("farmer_token", res.token);
        localStorage.setItem("farmer_name", res.name);
        sessionToken = res.token;
        currentUserName = res.name;
        showDashboard();
      } else if (res && res.code === "WRONG_PASSWORD") {
        showAlert("Wrong password entered. Please try again.", false);
      } else if (res && res.code === "NOT_REGISTERED") {
        showAlert("Not registered yet. Please create an account first.", false);
        switchAuthTab('signup');
        document.getElementById("signMobile").value = mobile;
      } else {
        showAlert(res ? res.error : "Connection error. Please try again.", false);
      }
    }

    async function handleSignupSubmit(e) {
      if (e) e.preventDefault();
      dismissAlert();
      const name = document.getElementById("signName").value.trim();
      const mobile = document.getElementById("signMobile").value.trim();
      const password = document.getElementById("signPassword").value.trim();

      setLoading("btnSignup", true, "Registering...");
      const res = await callBackendApi("signup", { name, mobile, password });
      setLoading("btnSignup", false, "Register Account");

      if (res && res.success) {
        localStorage.setItem("farmer_token", res.token);
        localStorage.setItem("farmer_name", res.name);
        sessionToken = res.token;
        currentUserName = res.name;
        showDashboard();
      } else if (res && res.code === "ALREADY_REGISTERED") {
        showAlert(res.error, false);
        switchAuthTab('login');
        document.getElementById("loginMobile").value = mobile;
      } else {
        showAlert(res ? res.error : "Registration failed", false);
      }
    }

    function showDashboard() {
      document.getElementById("authSection").classList.add("hidden");
      document.getElementById("dashboardSection").classList.remove("hidden");
      document.getElementById("userHeaderActions").innerHTML = `
        <div class="flex items-center space-x-3">
          <span class="text-sm font-medium">Hello, ${currentUserName}</span>
          <button onclick="logout()" class="text-xs bg-emerald-900 hover:bg-black/40 px-3 py-1.5 rounded-lg text-white transition"><i class="fa-solid fa-arrow-right-from-bracket mr-1"></i>Logout</button>
        </div>
      `;
      fetchUserRequests();
      startAutoSync();
    }

    function showAuth() {
      stopAutoSync();
      document.getElementById("authSection").classList.remove("hidden");
      document.getElementById("dashboardSection").classList.add("hidden");
      document.getElementById("userHeaderActions").innerHTML = '';
    }

    function logout() {
      localStorage.removeItem("farmer_token");
      localStorage.removeItem("farmer_name");
      sessionToken = null;
      lastRenderedHash = "";
      showAuth();
    }

    // High-visibility submission animation and execution
    async function submitFarmerRequest() {
      dismissAlert();

      if (!sessionToken) {
        showAlert("Your session has expired. Please log in again.", false);
        logout();
        return;
      }

      const input = document.getElementById("applyAadhaar");
      const cleanNum = (input.value || "").replace(/\D/g, "");

      if (cleanNum.length !== 12) {
        showAlert(`Please enter exactly 12 digits (currently entered: ${cleanNum.length}).`, false);
        return;
      }

      // Trigger instantaneous animation
      const btn = document.getElementById("btnSubmitReq");
      const content = document.getElementById("submitBtnContent");
      const loading = document.getElementById("submitBtnLoading");
      
      btn.disabled = true;
      input.disabled = true;
      content.classList.add("hidden");
      loading.classList.remove("hidden");
      btn.classList.add("animate-pulse", "opacity-90");

      try {
        const res = await callBackendApi("submitRequest", {
          token: sessionToken,
          aadhaar: cleanNum
        });

        if (res && res.success) {
          input.value = "";
          showAlert("Application submitted successfully! Status is Pending.", true);
          await fetchUserRequests();
        } else {
          const errorMsg = res && res.error ? res.error : "Submission failed. Please try again.";
          showAlert(errorMsg, false);
          if (errorMsg.includes("Session expired") || errorMsg.includes("Unauthorized")) {
            setTimeout(logout, 1500);
          }
        }
      } catch (err) {
        console.error("Submission failed:", err);
        showAlert("Network error communicating with server.", false);
      } finally {
        // Restore standard button state
        btn.disabled = false;
        input.disabled = false;
        content.classList.remove("hidden");
        loading.classList.add("hidden");
        btn.classList.remove("animate-pulse", "opacity-90");
      }
    }

    function startAutoSync() {
      stopAutoSync();
      remainingSeconds = 5;
      updateSyncLabel();

      countdownInterval = setInterval(() => {
        remainingSeconds--;
        if (remainingSeconds <= 0) {
          remainingSeconds = 5;
          fetchUserRequests();
        }
        updateSyncLabel();
      }, 1000);
    }

    function stopAutoSync() {
      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = null;
    }

    function updateSyncLabel() {
      const el = document.getElementById("syncCountdown");
      if (el) el.innerText = `Auto-sync in ${remainingSeconds}s`;
    }

    async function fetchUserRequests() {
      if (!sessionToken || isFetching) return;
      isFetching = true;

      try {
        const res = await apiGet(`action=getUserRequests&token=${encodeURIComponent(sessionToken)}`);
        
        if (!res || !res.success) {
          if (res && res.error && res.error.includes("Unauthorized")) logout();
          return;
        }

        const currentHash = JSON.stringify(res.requests);
        if (currentHash === lastRenderedHash) return;
        lastRenderedHash = currentHash;

        const tbody = document.getElementById("userRequestsTable");
        if (res.requests.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">No applications found. Submit your number above.</td></tr>`;
          return;
        }

        tbody.innerHTML = res.requests.map(r => {
          const isComplete = (r.status || "").toLowerCase() === "complete";
          const badge = isComplete
            ? `<span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full text-xs font-bold inline-flex items-center"><i class="fa-solid fa-check mr-1"></i>Complete</span>`
            : `<span class="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full text-xs font-bold inline-flex items-center"><i class="fa-solid fa-clock mr-1"></i>Pending</span>`;
          
          const actionBtn = isComplete && r.pdfId
            ? `<a href="https://drive.google.com/uc?export=download&id=${r.pdfId}" target="_blank" class="inline-flex items-center text-xs bg-emerald-700 hover:bg-emerald-800 text-white font-medium px-3.5 py-1.5 rounded-lg shadow-sm transition">
                <i class="fa-solid fa-cloud-arrow-down mr-1.5"></i> Download PDF
               </a>`
            : `<span class="text-xs text-slate-400 italic">Processing document...</span>`;

          const dateStr = new Date(r.timestamp).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });

          return `
            <tr class="hover:bg-slate-50/70 border-b border-slate-100 transition">
              <td class="px-6 py-4 font-mono text-xs font-semibold text-slate-600">${r.reqId}</td>
              <td class="px-6 py-4 font-mono font-medium text-slate-700">${r.maskedAadhaar}</td>
              <td class="px-6 py-4 text-xs text-slate-500">${dateStr}</td>
              <td class="px-6 py-4">${badge}</td>
              <td class="px-6 py-4 text-right">${actionBtn}</td>
            </tr>
          `;
        }).join("");
      } finally {
        isFetching = false;
      }
    }

    function setLoading(btnId, isLoading, text) {
      const btn = document.getElementById(btnId);
      const textElem = document.getElementById(btnId + "Text");
      const spinner = document.getElementById(btnId + "Spinner");
      if (!btn) return;
      btn.disabled = isLoading;
      if (textElem) textElem.innerText = text;
      if (spinner) {
        if (isLoading) spinner.classList.remove("hidden");
        else spinner.classList.add("hidden");
      }
    }

    async function callBackendApi(action, data) {
      const payload = { action, ...data };
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const text = await response.text();
        return JSON.parse(text);
      } catch (postErr) {
        const params = new URLSearchParams(payload);
        return await apiGet(params.toString());
      }
    }

    async function apiGet(queryStr) {
      try {
        const response = await fetch(`${API_URL}?${queryStr}&_ts=${Date.now()}`);
        return await response.json();
      } catch (e) {
        console.error("GET error:", e);
        return null;
      }
    }
  </script>
</body>
</html>
