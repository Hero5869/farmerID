<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Document Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; } .mono { font-family: 'JetBrains Mono', monospace; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

  <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white">🌐</div>
      <span class="font-bold text-white text-base">farmer ID Portal</span>
    </div>
    <div id="navUserBadge" class="hidden text-xs text-slate-400">
      Signed in as <span id="navUserName" class="text-white font-bold">--</span> 
      (<span id="navUserPhone" class="mono text-indigo-400">--</span>)
      <button onclick="logoutClient()" class="ml-3 text-rose-400 hover:underline">Log Out</button>
    </div>
  </nav>

  <div id="toastBox" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
    <!-- Auth Card -->
    <div id="authSection" class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl">
      <h2 id="authHeading" class="text-xl font-bold text-white text-center">Sign In to Your Account</h2>
      <p class="text-xs text-slate-400 text-center mt-1">Secured with client-side SHA-256 password hashing</p>

      <div class="flex border-b border-slate-800 my-4 text-xs font-bold">
        <button id="tabIn" onclick="setMode('login')" class="flex-1 pb-3 text-indigo-400 border-b-2 border-indigo-500">Sign In</button>
        <button id="tabUp" onclick="setMode('reg')" class="flex-1 pb-3 text-slate-500 hover:text-slate-300">Register</button>
      </div>

      <form onsubmit="handleAuthSubmit(event)" class="space-y-4 text-xs">
        <div id="nameDiv" class="hidden">
          <label class="block font-semibold text-slate-300 mb-1">Your Full Name</label>
          <input type="text" id="inputName" placeholder="e.g. John Doe" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white">
        </div>
        <div>
          <label class="block font-semibold text-slate-300 mb-1">Mobile Number (10 digits)</label>
          <input type="tel" id="inputPhone" required placeholder="9876543210" pattern="[0-9]{10}" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white">
        </div>
        <div>
          <label class="block font-semibold text-slate-300 mb-1">Password</label>
          <input type="password" id="inputPass" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white">
        </div>
        <div id="passConfirmDiv" class="hidden">
          <label class="block font-semibold text-slate-300 mb-1">Confirm Password</label>
          <input type="password" id="inputPassConfirm" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white">
        </div>
        <button type="submit" id="btnSubmitAuth" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow transition">Sign In</button>
      </form>
    </div>

    <!-- Portal Section -->
    <div id="portalSection" class="hidden space-y-6">
      <div class="bg-gradient-to-r from-slate-900 to-indigo-950 border border-indigo-900/40 rounded-3xl p-6 sm:p-8">
        <h2 class="text-xl font-bold text-white">Request Document Delivery</h2>
        <p class="text-xs text-slate-400 mt-1">Enter Aadhaar Number .</p>
        <form onsubmit="handleRequestDoc(event)" class="mt-4 flex flex-col sm:flex-row gap-3">
          <input type="text" id="inputDocId" required placeholder="Enter Aadhaar Number (e.g. 1234 1234 1234)" class="flex-1 px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white uppercase font-bold">
          <button type="submit" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs">Send Request</button>
        </form>
      </div>

      <!-- Requests Tracker -->
      <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-xl">
        <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
          <h3 class="font-bold text-sm text-white">Your Document Requests</h3>
          <button onclick="renderUserRequests()" class="text-xs text-indigo-400 hover:underline">Refresh</button>
        </div>
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-950 text-slate-400 uppercase border-b border-slate-800">
            <tr>
              <th class="py-3 px-6">Document ID</th>
              <th class="py-3 px-6">Status</th>
              <th class="py-3 px-6 text-right">PDF Download</th>
            </tr>
          </thead>
          <tbody id="userRequestsList" class="divide-y divide-slate-800/60"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    // Config: Apps Script Web App URL
    const APPS_SCRIPT_URL = localStorage.getItem('docu_user_api_url') || "https://script.google.com/macros/s/AKfycbxUKsgEBu8HVyJuTUV6OTQOFJ_QO7PI5hgXrqBmBVQTqyDqpMaMZrkiaXAf7X2kESYc/exec";
    let authMode = 'login';
    let currentUser = JSON.parse(localStorage.getItem('docu_standalone_cust') || 'null');

    async function hashPassword(text) {
      const data = new TextEncoder().encode(text + "_docuvault_salt_2026");
      const hashBuf = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function setMode(m) {
      authMode = m;
      document.getElementById('nameDiv').classList.toggle('hidden', m === 'login');
      document.getElementById('passConfirmDiv').classList.toggle('hidden', m === 'login');
      document.getElementById('authHeading').textContent = m === 'login' ? 'Sign In to Your Account' : 'Register New Account';
      document.getElementById('btnSubmitAuth').textContent = m === 'login' ? 'Sign In' : 'Register & Sign In';
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const phone = document.getElementById('inputPhone').value.trim();
      const pass = document.getElementById('inputPass').value;
      const passHash = await hashPassword(pass);

      let localUsers = JSON.parse(localStorage.getItem('docu_standalone_users') || '[]');

      if (authMode === 'reg') {
        const name = document.getElementById('inputName').value.trim();
        const conf = document.getElementById('inputPassConfirm').value;
        if (pass !== conf) { alert("Passwords do not match"); return; }
        if (localUsers.some(u => u.phone === phone)) { alert("User already registered!"); return; }

        currentUser = { name, phone, passHash };
        localUsers.push(currentUser);
        localStorage.setItem('docu_standalone_users', JSON.stringify(localUsers));
        sendRemote('REGISTER', { userName: name, userPhone: phone, passwordHash: passHash });
      } else {
        const user = localUsers.find(u => u.phone === phone);
        if (!user || user.passHash !== passHash) { alert("Invalid phone or password"); return; }
        currentUser = user;
      }

      localStorage.setItem('docu_standalone_cust', JSON.stringify(currentUser));
      updateView();
    }

    function updateView() {
      if (currentUser) {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('portalSection').classList.remove('hidden');
        document.getElementById('navUserBadge').classList.remove('hidden');
        document.getElementById('navUserName').textContent = currentUser.name;
        document.getElementById('navUserPhone').textContent = currentUser.phone;
        renderUserRequests();
      } else {
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('portalSection').classList.add('hidden');
        document.getElementById('navUserBadge').classList.add('hidden');
      }
    }

    function logoutClient() {
      currentUser = null;
      localStorage.removeItem('docu_standalone_cust');
      updateView();
    }

    async function handleRequestDoc(e) {
      e.preventDefault();
      const docId = document.getElementById('inputDocId').value.trim().toUpperCase();
      let allReqs = JSON.parse(localStorage.getItem('docu_standalone_reqs') || '[]');

      const reqObj = {
        id: "REQ-" + Math.floor(100000 + Math.random() * 900000),
        docId: docId,
        customerName: currentUser.name,
        customerPhone: currentUser.phone,
        status: "Pending",
        pdfData: null,
        createdAt: new Date().toISOString()
      };

      allReqs.unshift(reqObj);
      localStorage.setItem('docu_standalone_reqs', JSON.stringify(allReqs));
      sendRemote('SUBMIT_REQUEST', reqObj);

      document.getElementById('inputDocId').value = '';
      alert("Farmer ID requested!.");
      renderUserRequests();
    }

    function renderUserRequests() {
      const tbody = document.getElementById('userRequestsList');
      tbody.innerHTML = '';
      let allReqs = JSON.parse(localStorage.getItem('docu_standalone_reqs') || '[]');
      const myReqs = allReqs.filter(r => r.customerPhone === currentUser.phone);

      myReqs.forEach(r => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-950/40 border-b border-slate-800/60";
        const isReady = r.status === 'Ready' && r.pdfData;
        tr.innerHTML = `
          <td class="py-3 px-6 mono font-bold text-indigo-400">${r.docId}</td>
          <td class="py-3 px-6">${isReady ? '<span class="text-emerald-400 font-bold">Ready</span>' : '<span class="text-amber-400 font-bold">Pending Admin Upload</span>'}</td>
          <td class="py-3 px-6 text-right">${isReady ? '<button onclick="downloadPdf(\''+r.id+'\')" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg font-bold">Download PDF</button>' : '<span class="text-slate-500">Processing...</span>'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function downloadPdf(id) {
      let allReqs = JSON.parse(localStorage.getItem('docu_standalone_reqs') || '[]');
      const target = allReqs.find(r => r.id === id);
      if (!target || !target.pdfData) return;
      const a = document.createElement('a');
      a.href = target.pdfData;
      a.download = `Document_${target.docId}.pdf`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function sendRemote(action, data) {
      if (!APPS_SCRIPT_URL) return;
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action, ...data })
      }).catch(err => console.log(err));
    }

    window.onload = updateView;
  </script>
</body>
</html>
