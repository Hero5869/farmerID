<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kisan Digital Kendra | Farmer ID Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">

  <script>
    // Replace with your Web App Executable URL
    const API_URL = "https://script.google.com/macros/s/AKfycbxVz9rViRfVXulh30yZoPJsRoCs2I7v_RE3EMe8vjQr4fyNoPTv2uGJqWqTSr5txQ/exec";
  </script>

  <!-- Navbar -->
  <header class="bg-emerald-700 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-seedling text-2xl text-amber-300"></i>
        <h1 class="font-bold text-lg tracking-wide">Farmer ID Portal</h1>
      </div>
      <div id="authActions" class="space-x-2">
        <!-- Dynamic header actions -->
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <!-- Unauthenticated View -->
    <section id="authSection" class="max-w-md mx-auto bg-white rounded-xl shadow p-6 border border-slate-200">
      <div class="flex justify-center border-b border-slate-200 mb-6">
        <button id="tabLogin" onclick="switchAuthTab('login')" class="w-1/2 pb-3 font-semibold text-emerald-600 border-b-2 border-emerald-600">Login</button>
        <button id="tabSignup" onclick="switchAuthTab('signup')" class="w-1/2 pb-3 font-semibold text-slate-500 hover:text-slate-800">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mobile Number</label>
          <input type="tel" id="loginMobile" maxlength="10" placeholder="10-digit Mobile" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
          <input type="password" id="loginPassword" placeholder="Minimum 4 digits" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-medium transition shadow">Sign In</button>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" onsubmit="handleSignupSubmit(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Full Name</label>
          <input type="text" id="signName" placeholder="Your Name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mobile Number</label>
          <input type="tel" id="signMobile" maxlength="10" placeholder="10-digit Mobile" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Create Password</label>
          <input type="password" id="signPassword" placeholder="Min 4 digits" minlength="4" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-medium transition shadow">Create Account</button>
      </form>
    </section>

    <!-- Authenticated Dashboard -->
    <section id="dashboardSection" class="hidden space-y-6">
      <!-- Submission Card -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
        <h2 class="text-lg font-bold text-slate-800 mb-2">New Farmer ID Application</h2>
        <p class="text-sm text-slate-500 mb-4">Submit the 12-digit Aadhaar number to verify and prepare your Farmer Card document.</p>
        <form onsubmit="handleApplySubmit(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Applicant Name</label>
            <input type="text" id="applyName" required placeholder="Farmer Full Name" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Aadhaar Number</label>
            <input type="text" id="applyAadhaar" maxlength="12" pattern="\d{12}" required placeholder="12-digit UID" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500" />
          </div>
          <div class="flex items-end">
            <button type="submit" id="btnSubmitReq" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg font-semibold transition flex items-center justify-center space-x-2">
              <i class="fa-solid fa-paper-plane"></i>
              <span>Submit Request</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Applications Table -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
          <div>
            <h3 class="font-bold text-slate-800">Your Recent Applications</h3>
            <span class="text-xs text-slate-500">Displaying your top 5 newest entries</span>
          </div>
          <button onclick="fetchUserRequests()" class="text-emerald-600 hover:text-emerald-700 text-sm font-semibold flex items-center space-x-1">
            <i class="fa-solid fa-rotate-right"></i>
            <span>Refresh</span>
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-600">
            <thead class="bg-slate-100 text-slate-700 font-semibold text-xs uppercase tracking-wider">
              <tr>
                <th class="px-6 py-3">Request ID</th>
                <th class="px-6 py-3">Applicant Name</th>
                <th class="px-6 py-3">Aadhaar (Masked)</th>
                <th class="px-6 py-3">Date</th>
                <th class="px-6 py-3">Status</th>
                <th class="px-6 py-3 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="userRequestsTable" class="divide-y divide-slate-100">
              <tr><td colspan="6" class="text-center py-6 text-slate-400">Loading your entries...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    let sessionToken = localStorage.getItem("farmer_token");
    let currentUserName = localStorage.getItem("farmer_name");

    window.onload = () => {
      if (sessionToken) {
        showDashboard();
      } else {
        showAuth();
      }
    };

    function switchAuthTab(type) {
      if (type === 'login') {
        document.getElementById("loginForm").classList.remove("hidden");
        document.getElementById("signupForm").classList.add("hidden");
        document.getElementById("tabLogin").className = "w-1/2 pb-3 font-semibold text-emerald-600 border-b-2 border-emerald-600";
        document.getElementById("tabSignup").className = "w-1/2 pb-3 font-semibold text-slate-500 hover:text-slate-800";
      } else {
        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("signupForm").classList.remove("hidden");
        document.getElementById("tabSignup").className = "w-1/2 pb-3 font-semibold text-emerald-600 border-b-2 border-emerald-600";
        document.getElementById("tabLogin").className = "w-1/2 pb-3 font-semibold text-slate-500 hover:text-slate-800";
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const mobile = document.getElementById("loginMobile").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      const res = await callBackend({ action: "login", mobile, password });
      if (res && res.success) {
        localStorage.setItem("farmer_token", res.token);
        localStorage.setItem("farmer_name", res.name);
        sessionToken = res.token;
        currentUserName = res.name;
        showDashboard();
      } else {
        alert(res ? res.error : "Failed to connect to backend");
      }
    }

    async function handleSignupSubmit(e) {
      e.preventDefault();
      const name = document.getElementById("signName").value.trim();
      const mobile = document.getElementById("signMobile").value.trim();
      const password = document.getElementById("signPassword").value.trim();

      const res = await callBackend({ action: "signup", name, mobile, password });
      if (res && res.success) {
        localStorage.setItem("farmer_token", res.token);
        localStorage.setItem("farmer_name", res.name);
        sessionToken = res.token;
        currentUserName = res.name;
        showDashboard();
      } else {
        alert(res ? res.error : "Failed to signup");
      }
    }

    function showDashboard() {
      document.getElementById("authSection").classList.add("hidden");
      document.getElementById("dashboardSection").classList.remove("hidden");
      document.getElementById("authActions").innerHTML = `
        <span class="text-sm font-medium mr-2">Welcome, ${currentUserName}</span>
        <button onclick="logout()" class="text-xs bg-emerald-800 hover:bg-emerald-900 px-3 py-1.5 rounded text-white"><i class="fa-solid fa-arrow-right-from-bracket mr-1"></i>Logout</button>
      `;
      fetchUserRequests();
    }

    function showAuth() {
      document.getElementById("authSection").classList.remove("hidden");
      document.getElementById("dashboardSection").classList.add("hidden");
      document.getElementById("authActions").innerHTML = '';
    }

    function logout() {
      localStorage.removeItem("farmer_token");
      localStorage.removeItem("farmer_name");
      sessionToken = null;
      showAuth();
    }

    async function handleApplySubmit(e) {
      e.preventDefault();
      const applicantName = document.getElementById("applyName").value.trim();
      const aadhaar = document.getElementById("applyAadhaar").value.trim();
      const btn = document.getElementById("btnSubmitReq");
      btn.disabled = true;
      btn.innerText = "Submitting...";

      const res = await callBackend({ action: "submitRequest", token: sessionToken, applicantName, aadhaar });
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-paper-plane mr-1"></i> Submit Request`;

      if (res && res.success) {
        document.getElementById("applyAadhaar").value = '';
        fetchUserRequests();
      } else {
        alert(res ? res.error : "Submission failed");
      }
    }

    async function fetchUserRequests() {
      const tbody = document.getElementById("userRequestsTable");
      const res = await callBackend({ action: "getUserRequests", token: sessionToken });
      
      if (!res || !res.success) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-red-500">Failed to load data</td></tr>`;
        return;
      }

      if (res.requests.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-400">No applications found. Submit one above.</td></tr>`;
        return;
      }

      tbody.innerHTML = res.requests.map(r => {
        const isComplete = r.status.toLowerCase() === 'complete';
        const badge = isComplete
          ? `<span class="bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full text-xs font-bold">Complete</span>`
          : `<span class="bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-full text-xs font-bold">Pending</span>`;
        
        const actionBtn = isComplete && r.pdfId
          ? `<a href="https://drive.google.com/uc?export=download&id=${r.pdfId}" target="_blank" class="inline-flex items-center text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3 py-1.5 rounded transition">
              <i class="fa-solid fa-download mr-1"></i> Download PDF
             </a>`
          : `<span class="text-xs text-slate-400 italic">Processing...</span>`;

        const dateStr = new Date(r.timestamp).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });

        return `
          <tr class="hover:bg-slate-50 border-b border-slate-100">
            <td class="px-6 py-4 font-mono text-xs font-semibold text-slate-700">${r.reqId}</td>
            <td class="px-6 py-4 font-medium text-slate-800">${r.applicantName}</td>
            <td class="px-6 py-4 font-mono">${r.maskedAadhaar}</td>
            <td class="px-6 py-4 text-xs">${dateStr}</td>
            <td class="px-6 py-4">${badge}</td>
            <td class="px-6 py-4 text-right">${actionBtn}</td>
          </tr>
        `;
      }).join('');
    }

    async function callBackend(payload) {
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload),
          headers: { "Content-Type": "text/plain;charset=utf-8" }
        });
        return await response.json();
      } catch (e) {
        console.error(e);
        return null;
      }
    }
  </script>
</body>
</html>
